name: Setup Node
description: Setup Node

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install
